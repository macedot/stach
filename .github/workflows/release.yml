name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-amd64
            asset: stach-linux-amd64
            archive: stach-linux-amd64.tar.gz
            exe: stach
          - os: ubuntu-24.04-arm
            target: linux-arm64
            asset: stach-linux-arm64
            archive: stach-linux-arm64.tar.gz
            exe: stach
          - os: macos-14
            target: darwin-arm64
            asset: stach-darwin-arm64
            archive: stach-darwin-arm64.tar.gz
            exe: stach
          - os: windows-latest
            target: windows-amd64
            asset: stach-windows-amd64.exe
            archive: stach-windows-amd64.zip
            exe: stach.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Goose (Unix)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          # No Linux arm64 goose compiler exists yet; the download below
          # fails with a clear error until one is published upstream.
          case "${{ runner.arch }}" in
            ARM64) asset=goose-v2026.3-linux-arm64.tar.gz ;;
            *)     asset=goose-v2026.3-linux-x64.tar.gz ;;
          esac
          curl -fsSL -o /tmp/goose.tar.gz \
            "https://github.com/aardappel/goose/releases/download/v2026.3/${asset}" \
            || { echo "ERROR: no goose compiler asset ${asset} at v2026.3"; exit 1; }
          mkdir -p "$HOME/goose"
          tar -xzf /tmp/goose.tar.gz -C "$HOME/goose" --strip-components=1
          echo "$HOME/goose" >> "$GITHUB_PATH"
          goose version

      - name: Build (Unix)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          make OUT="${{ matrix.exe }}"
          test -x "${{ matrix.exe }}"
          mkdir -p dist
          cp "${{ matrix.exe }}" "dist/${{ matrix.asset }}"
          # Smoke: no args prints usage, exit 2
          set +e
          "./${{ matrix.exe }}" >/dev/null 2>&1
          code=$?
          set -e
          test "$code" -eq 2
          tar -czf "dist/${{ matrix.archive }}" -C dist "${{ matrix.asset }}"

      - name: Install Goose (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = "https://github.com/aardappel/goose/releases/download/v2026.3/goose-v2026.3-windows-x64.zip"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\goose.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\goose.zip" -DestinationPath "$env:RUNNER_TEMP\goose"
          $dir = Get-ChildItem "$env:RUNNER_TEMP\goose" | Select-Object -First 1
          echo "$($dir.FullName)" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          if not exist dist mkdir dist

          rem goose build finds MSVC itself and compiles the C from src\main.build.
          goose build src\main.goose
          if errorlevel 1 exit /b 1
          copy /Y stach.exe dist\stach-windows-amd64.exe
          if errorlevel 1 exit /b 1
          powershell -NoProfile -Command "Compress-Archive -Path 'dist\\stach-windows-amd64.exe' -DestinationPath 'dist\\${{ matrix.archive }}' -Force"

      - name: Smoke (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          rem No args prints usage and must exit with code 2 exactly.
          .\stach.exe >nul 2>&1
          if NOT errorlevel 2 exit /b 1
          if errorlevel 3 exit /b 1

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.archive }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
