name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-amd64
            asset: stach-linux-amd64
            archive: stach-linux-amd64.tar.gz
            exe: stach
          - os: ubuntu-24.04-arm
            target: linux-arm64
            asset: stach-linux-arm64
            archive: stach-linux-arm64.tar.gz
            exe: stach
          - os: macos-latest
            target: darwin-arm64
            asset: stach-darwin-arm64
            archive: stach-darwin-arm64.tar.gz
            exe: stach
          - os: windows-latest
            target: windows-amd64
            asset: stach-windows-amd64.exe
            archive: stach-windows-amd64.zip
            exe: stach.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Odin
        uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release: latest

      - name: Build (Unix)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          make OUT="${{ matrix.exe }}"
          test -x "${{ matrix.exe }}"
          mkdir -p dist
          cp "${{ matrix.exe }}" "dist/${{ matrix.asset }}"
          # Smoke: no args prints usage, exit 2
          set +e
          "./${{ matrix.exe }}" >/dev/null 2>&1
          code=$?
          set -e
          test "$code" -eq 2
          tar -czf "dist/${{ matrix.archive }}" -C dist "${{ matrix.asset }}"

      - name: Enable MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          if not exist build mkdir build
          if not exist dist mkdir dist

          rem miniz (gzip) + thin wrapper as one static lib for Odin foreign import.
          cl /nologo /O2 /MT /Ivendor /c vendor\miniz\miniz.c /Fobuild\miniz.obj
          if errorlevel 1 exit /b 1
          cl /nologo /O2 /MT /Ivendor /c vendor\miniz\miniz_tinfl.c /Fobuild\miniz_tinfl.obj
          if errorlevel 1 exit /b 1
          cl /nologo /O2 /MT /Ivendor /c vendor\miniz\miniz_tdef.c /Fobuild\miniz_tdef.obj
          if errorlevel 1 exit /b 1
          cl /nologo /O2 /MT /Ivendor /c vendor\miniz\miniz_zip.c /Fobuild\miniz_zip.obj
          if errorlevel 1 exit /b 1
          cl /nologo /O2 /MT /Ivendor /c vendor\stach_gzip_wrap.c /Fobuild\stach_gzip_wrap.obj
          if errorlevel 1 exit /b 1
          lib /nologo /OUT:build\stachgz.lib build\miniz.obj build\miniz_tinfl.obj build\miniz_tdef.obj build\miniz_zip.obj build\stach_gzip_wrap.obj
          if errorlevel 1 exit /b 1

          odin build src -out:stach.exe -o:speed -extra-linker-flags:"/NODEFAULTLIB:MSVCRT"
          if errorlevel 1 exit /b 1
          copy /Y stach.exe dist\stach-windows-amd64.exe
          if errorlevel 1 exit /b 1
          powershell -NoProfile -Command "Compress-Archive -Path 'dist\\stach-windows-amd64.exe' -DestinationPath 'dist\\${{ matrix.archive }}' -Force"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.archive }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
